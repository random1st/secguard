[package]
name = "secguard-secrets"
description = "Secret and credential detection. Renamed from secguard-secrets on 2026-05-20 to align with the canonical Mid Layer name in ~/.diana/src/CLAUDE.md."
version = "0.5.5"
edition.workspace = true
license = "Apache-2.0 WITH Commons-Clause-1.0"

[features]
default = []
ml = ["secguard-brain"]
# Off by default: the HTTP stack is a large dependency and a network call in a
# hook is a deliberate choice, never an accident of building the crate.
verification = ["reqwest"]

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Baseline (RAN-415): content fingerprints + gitignore-aware repo walk.
sha2 = { workspace = true }
ignore = { workspace = true }
thiserror = "2"
base64 = "0.22"
# Verification cache lives under the user cache dir.
dirs = "6"
# Verification results carry a checked-at timestamp.
chrono = { version = "0.4", features = ["clock", "serde"] }
# Live token verification talks to provider endpoints from a sync hook path,
# so the blocking client, and only behind the feature that turns it on.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false, optional = true }
secguard-brain = { path = "../secguard-brain", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
