context: |
  ## Problem
  Conclave (3 providers x 2 rounds, arbiter Opus 4.8) on "where to develop
  secguard + cross-assistant" reached a unanimous verdict: secguard is a guard
  (control), not a detection library (reach); enforcement-first. Two grounded
  findings drive this spec:

  1. VERIFIED BLOCKER - Codex secrets fail-open. `install_codex` never registers
     the secrets-scan hook, and even when invoked `run_secrets_scan` emits
     `updatedInput` which Codex ignores (PreToolUse cannot rewrite input). A Codex
     user with secguard installed gets the destructive-command guard but ZERO
     secret redaction while the product implies "protected". The secret silently
     reaches the tool. This contradicts secguard's entire thesis.
  2. Unanimous #1 move - prove coverage, don't add surface. No artifact shows,
     per assistant target x capability x mode, whether protection is enforced /
     advisory / uncovered. Silent fail-open surfaces manufacture false confidence.

  ## Goal
  - D1: Make Codex secrets fail-closed - deny the tool call when a credential is
    detected and the target cannot rewrite input; config opt-out to fail-loud.
    Register the secrets-scan hook for Codex in `install_codex`.
  - D2: Add `secguard selftest` - an Enforcement Coverage Matrix reporting
    enforced/advisory/uncovered per target x capability, with a `--check` CI gate
    that fails when a cell silently regresses to uncovered.

  ## Privacy
  Classification: Internal
workflow:
  mode: plan
  target_architecture:
    summary: Every degraded enforcement surface fails closed or loud, never silently open; secguard ships a self-test that proves, per target x capability, exactly what is enforced vs advisory vs uncovered.
    invariants:
    - A detected credential on a target that cannot redact results in a denied (blocked) tool call, unless explicitly configured to fail-loud.
    - No enforcement capability silently degrades to "uncovered" without the coverage matrix reporting it and the --check gate failing.
    - The coverage-matrix transport truth is derived from the real binary's observed behavior, not a hand-maintained table.
  delivery_strategy:
    summary: Two independent bricks on main - the Codex fail-closed fix (small, closes the verified blocker) then the selftest matrix (makes coverage measurable). Both land toward the enforcement-first target state.
    rationale: Fix the verified fail-open first so the matrix reports it fixed; the matrix then guards against future silent regressions.
