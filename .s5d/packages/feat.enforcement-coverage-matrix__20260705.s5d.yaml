hypotheses:
- id: codex-fail-closed-coverage-matrix-close-the-fail-open-without-regressing-enforcement
  title: Codex fail-closed + coverage matrix close the fail-open without regressing enforcement
  content: Making Codex secrets fail-closed (deny the tool call when a credential is detected and the target cannot rewrite input, config opt-out to fail-loud) plus registering the secrets-scan hook for Codex closes the verified silent fail-open, without weakening Claude/Gemini redaction or the existing destructive-command enforcement. The `secguard selftest` matrix reports enforced/advisory/uncovered per target x capability from live classifier probes + config-aware transport, and its `--check` gate (asserted in tests/cli.rs) fails if any cell regresses to uncovered or a probe misses — so a future reopening of the fail-open breaks CI instead of shipping quietly.
  scope: crates/secguard-cli (hook.rs, cmd_init.rs, main.rs, cmd_selftest.rs, tests/cli.rs), crates/secguard-guard/src/config.rs
  kind: system
  layer: L1
  r_eff: null
  evidence:
  - id: 20260705-gate-review-codex-fail-closed-coverage-matrix-close-the-fail-open-without-regressing-enforcement
    type: gate:review
    content: 'Independent adversarial review (Agent reviewer), 2 rounds. R1 = CONCERNS/HIGH: found a real blocker the author missed — install_codex used a coarse "secguard hook" idempotency marker that matched the existing guard hook, so an existing Codex user re-running `init codex` after upgrade got "already installed" and never received the new fail-closed secrets-scan hook (reviewer reproduced against the built binary). Fixed: install_codex now checks each hook type independently ("hook guard --target codex" / "hook secrets-scan --target codex") and pushes each missing hook; regression test init_codex_upgrade_adds_secrets_scan_to_existing_guard_only_install added. Also fixed matrix accuracy (transport_matrix + config display now use is_strict() honoring SECGUARD_STRICT, not the raw field) and added compute_pass() + 5 negative/positive unit tests proving --check fails on uncovered cell / detection miss / silent scanner. R2 = APPROVE/SEVERITY NONE: reviewer independently re-reproduced the upgrade fix, verified SECGUARD_STRICT=0 renders the Claude cell advisory, and ran cargo test --all = 406 passed + clippy -D warnings clean himself. Security-critical Codex deny branch (hook.rs run_secrets_scan) confirmed sound: deny path never emits the raw secret (only rule_id/type names), telemetry fires pre-branch with types only, fail-loud path passes updated_input:None. Out-of-scope, tracked separately: README.md:126-179 documents a [postuse]/`diana dev hook post-use` capability absent from this repo (pre-existing working-tree modification, not part of this change''s edits).'
